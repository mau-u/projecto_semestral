<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Productos - Mil Sabores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;family=Pacifico&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-menu">
        <h2>Administrador</h2>
        <a href="admin.html">Inicio</a>
        <a href="admin-productos.html">Productos</a>
        <a href="admin-usuarios.html">Usuarios</a>
        <a href="index.html">Ver tienda</a>
      </aside>
      <main class="admin-content">
        <h1>Productos</h1>
        <div class="form-card">
          <h2>Nuevo producto</h2>
          <form id="adminProductForm" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label for="adminCode">Código</label>
                <input id="adminCode" minlength="3" required>
              </div>
              <div class="form-group">
                <label for="adminName">Nombre</label>
                <input id="adminName" maxlength="100" required>
              </div>
              <div class="form-group full">
                <label for="adminDescription">Descripción</label>
                <textarea id="adminDescription" maxlength="500"></textarea>
              </div>
              <div class="form-group">
                <label for="adminPrice">Precio</label>
                <input id="adminPrice" type="number" min="0" step="0.01" required>
              </div>
              <div class="form-group">
                <label for="adminStock">Stock</label>
                <input id="adminStock" type="number" min="0" step="1" required>
              </div>
              <div class="form-group">
                <label for="adminCriticalStock">Stock crítico</label>
                <input id="adminCriticalStock" type="number" min="0" step="1">
              </div>
              <div class="form-group">
                <label for="adminCategory">Categoría</label>
                <select id="adminCategory" required>
                  <option value="">Seleccione</option>
                  <option>Tortas Cuadradas</option>
                  <option>Tortas Circulares</option>
                  <option>Postres Individuales</option>
                  <option>Productos Sin Azúcar</option>
                  <option>Pastelería Tradicional</option>
                  <option>Productos Sin Gluten</option>
                  <option>Productos Vegana</option>
                  <option>Tortas Especiales</option>
                </select>
              </div>
            </div>
            <button type="submit">Crear producto</button>
            <p id="adminProductMessage"></p>
          </form>
        </div>
        <h2>Listado de productos</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>
                  Código
                </th>
                <th>
                  Nombre
                </th>
                <th>
                  Categoría
                </th>
                <th>
                  Precio
                </th>
                <th>
                  Stock
                </th>
                <th>
                  Acción
                </th>
              </tr>
            </thead>
            <tbody id="adminProductsBody">
            </tbody>
          </table>
        </div>
      </main>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
